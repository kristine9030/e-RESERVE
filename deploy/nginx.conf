# /etc/nginx/sites-available/e-reserve   (then: ln -s into sites-enabled, nginx -t, reload)
# Replace YOUR-DOMAIN and the PHP-FPM socket version. Get the certificate with:
#   certbot --nginx -d YOUR-DOMAIN

server {
    listen 80;
    server_name YOUR-DOMAIN;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name YOUR-DOMAIN;

    # certbot fills these in:
    # ssl_certificate     /etc/letsencrypt/live/YOUR-DOMAIN/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/YOUR-DOMAIN/privkey.pem;

    root /var/www/e-reserve/public;   # ONLY public/ is web-reachable: .env, vendor/, storage/ are not
    index index.php;
    charset utf-8;

    # Three PDFs of up to 5 MB each can arrive in one visit; keep a little headroom.
    client_max_body_size 8m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 60s;
    }

    # Never serve dotfiles (.env, .git) …
    location ~ /\.(?!well-known) { deny all; }

    # … and cache static assets.
    location ~* \.(?:css|js|svg|png|jpe?g|webp|woff2?)$ {
        expires 30d;
        access_log off;
    }
}
