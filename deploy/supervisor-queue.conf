; /etc/supervisor/conf.d/e-reserve-queue.conf
; Sends the queued emails (approved / returned / ticket ready).
;   sudo supervisorctl reread && sudo supervisorctl update && sudo supervisorctl start e-reserve-queue:*
; After every deploy:  php artisan queue:restart

[program:e-reserve-queue]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/e-reserve/artisan queue:work --sleep=3 --tries=3 --backoff=30 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/log/e-reserve-queue.log
stopwaitsecs=3600
