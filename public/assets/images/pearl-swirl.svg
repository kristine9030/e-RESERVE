<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EFEDEC"/>
      <stop offset=".5" stop-color="#FAF9F8"/>
      <stop offset="1" stop-color="#F1F0EF"/>
    </linearGradient>
    <linearGradient id="rib" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".45" stop-color="#fff" stop-opacity=".95"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C9C7C5" stop-opacity=".0"/>
      <stop offset=".5" stop-color="#C9C7C5" stop-opacity=".35"/>
      <stop offset="1" stop-color="#C9C7C5" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="soft2" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="9"/></filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#base)"/>
  <!-- soft shadow valleys between the silk folds -->
  <path d="M-80 640 C 260 380, 560 760, 900 520 S 1500 300, 1700 420 L1700 560 C1500 460, 1180 760, 880 700 S 300 560, -80 800 Z" fill="url(#shade)" filter="url(#soft)"/>
  <path d="M520 -60 C 640 260, 520 520, 760 760 S 1100 1000, 1180 1100 L1020 1100 C 980 900, 700 880, 560 640 S 420 200, 360 -60 Z" fill="url(#shade)" filter="url(#soft)" opacity=".7"/>
  <!-- bright silk ribbons -->
  <path d="M-100 300 C 300 80, 700 520, 1000 300 S 1500 40, 1700 160 L1700 330 C1500 230, 1200 520, 920 520 S 300 260, -100 520 Z" fill="url(#rib)" filter="url(#soft2)"/>
  <path d="M560 -40 C 760 240, 640 520, 900 700 S 1300 900, 1500 1060 L1300 1060 C1180 940, 820 900, 640 700 S 520 240, 360 -40 Z" fill="url(#rib)" filter="url(#soft2)" opacity=".9"/>
  <path d="M-60 880 C 300 700, 640 960, 1000 820 S 1480 640, 1680 760 L1680 900 C1480 800, 1200 1000, 960 1000 S 300 860, -60 1020 Z" fill="url(#rib)" filter="url(#soft2)" opacity=".8"/>
  <ellipse cx="1260" cy="180" rx="360" ry="150" fill="#fff" opacity=".7" filter="url(#soft)" transform="rotate(-18 1260 180)"/>
  <ellipse cx="260" cy="760" rx="320" ry="120" fill="#fff" opacity=".6" filter="url(#soft)" transform="rotate(-12 260 760)"/>
</svg>
